<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Sleepiness Data</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openLogSleepinessModal()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-segment [(ngModel)]="sleepinessSegment" mode="ios" class="custom-segment">
    <ion-segment-button value="week">
      <ion-label>Week</ion-label>
    </ion-segment-button>
    <ion-segment-button value="day">
      <ion-label>Day</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div class="history-list">
    <h3>Check-In History</h3>
    <ion-card *ngFor="let item of sleepinessLogs" class="dark-stat-card">
      <ion-card-content>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="mono-font stat-value" style="font-size: 1.2rem;">Level {{ item.loggedValue }}</span>
          <span class="stat-label">{{ item.loggedAt | date:'shortTime' }}</span>
        </div>
        <p class="stat-label" style="margin-top: 6px;" *ngIf="item.notes">Notes: {{ item.notes }}</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
