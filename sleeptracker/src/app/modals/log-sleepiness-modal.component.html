<ion-content class="modal-content">
  <div class="modal-container">
    
    <div class="modal-header">
      <div>
        <h2 class="modal-title">Log Sleepiness</h2>
        <p class="modal-subtitle">Keep track of your drowsiness through the day’s activities.</p>
      </div>
      <ion-button fill="clear" class="close-btn" (click)="dismiss()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="form-row">
      <div class="input-group">
        <label class="field-label">Day</label>
        <ion-datetime-button datetime="date-picker"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="date-picker" presentation="date" [(ngModel)]="selectedDate"></ion-datetime>
          </ng-template>
        </ion-modal>
      </div>

      <div class="input-group">
        <label class="field-label">Time</label>
        <ion-datetime-button datetime="time-picker"></ion-datetime-button>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime id="time-picker" presentation="time" [(ngModel)]="selectedTime"></ion-datetime>
          </ng-template>
        </ion-modal>
      </div>
    </div>

    <div class="section-block">
      <label class="field-label">Sleepiness Level</label>
      <div class="level-grid">
        <div 
          *ngFor="let level of scaleValues; let i = index" 
          class="level-box" 
          [class.selected]="selectedLevel === (i + 1)"
          (click)="selectLevel(i + 1)">
          {{ i + 1 }}
        </div>
      </div>
      <div class="level-description" *ngIf="selectedLevel">
        {{ getLevelDescription(selectedLevel) }}
      </div>
    </div>

    <!-- What's Happening? (Notes) -->
    <div class="section-block">
      <label class="field-label">What's Happening?</label>
      <ion-textarea 
        [(ngModel)]="notes" 
        placeholder="Describe what you were doing around the time of this entry." 
        rows="3"
        class="custom-textarea">
      </ion-textarea>
    </div>

    <!-- Save Button -->
    <ion-button expand="block" class="save-btn" (click)="saveLog()">
      <ion-icon name="flash" slot="start"></ion-icon> Save Log
    </ion-button>

  </div>
</ion-content>
